project:
  type: website
  output-dir: _site
  # Rewrite sitemap locs to clean URLs after Quarto emit (see tools/seo_post_render.py).
  post-render:
    - tools/seo_post_render.py
  # Never ship draft work-in-progress under /posts/drafts/ to production builds.
  # Local draft preview: `quarto render posts/drafts/<slug>/index.qmd`
  render:
    - "*.qmd"
    - "!posts/drafts/**"

website:
  title: "Yoram Gilboa"
  site-url: "https://gilboa.blog"
  description: "Data-driven analysis of US inflation, jobs, GDP, and Fed policy. Clear charts and commentary on CPI, PCE, FOMC, and labor market trends."
  # gone: draft:true pages are empty/unlinked (safer than unlinked, which still publishes full HTML).
  draft-mode: gone
  favicon: favicon.png
  open-graph: true
  twitter-card:
    site: "@gilboa"

  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - about.qmd
      - href: index.qmd
        text: Blog
    right:
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/YoramGilboa

  page-footer:
    left: "© 2025-2026 Gilboa"
    right:
      - text: About
        href: about.qmd
      - text: RSS
        href: index.xml

format:
  html:
    theme: theme.scss
    css:
      - styles.css
      - styles-site.css
    html-math-method: katex
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: false
    code-copy: true
    # Self-referencing canonical to clean URLs (posts: .../slug/, home: /, about: /about.html).
    # Requires website.site-url above. Does not change on-disk filenames.
    canonical-url: true

execute:
  freeze: auto
